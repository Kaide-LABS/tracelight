services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - synth_output:/tmp/synth_output
      - chroma_data:/tmp/chroma_data
    environment:
      - DEMO_MODE=true

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend/demo_data:/app/demo_data:ro

volumes:
  synth_output:
  chroma_data:
